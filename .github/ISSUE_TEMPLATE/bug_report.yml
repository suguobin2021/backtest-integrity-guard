name: Bug report
description: Report a reproducible integrity-checking defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic or public data only. Do not include credentials, private datasets, or proprietary strategy logic.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command and the smallest synthetic input that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
