[metadata]
name = backtest-integrity-guard
version = 0.2.2
description = Auditable checks for causal backtests, OHLCV data, execution timing, and frozen inputs.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/suguobin2021/backtest-integrity-guard
project_urls =
    Source = https://github.com/suguobin2021/backtest-integrity-guard
    Issues = https://github.com/suguobin2021/backtest-integrity-guard/issues
    Releases = https://github.com/suguobin2021/backtest-integrity-guard/releases
    Changelog = https://github.com/suguobin2021/backtest-integrity-guard/blob/main/CHANGELOG.md
license = MIT
license_files = LICENSE
author = suguobin2021
keywords = backtest, quantitative-finance, causality, lookahead-bias, ohlcv, data-validation
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Information Analysis

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    btguard = backtest_integrity_guard.cli:main
