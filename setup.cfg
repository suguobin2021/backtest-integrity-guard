[metadata]
name = backtest-integrity-guard
version = 0.2.0
description = Auditable checks for causal backtests, OHLCV data, execution timing, and frozen inputs.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = suguobin2021

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    btguard = backtest_integrity_guard.cli:main
